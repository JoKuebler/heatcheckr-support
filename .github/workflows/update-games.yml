# Refreshes the "Last night's NBA games" section on the home page once a day.
# Runs scripts/update_games.py (reads the public API, no secrets), commits
# index.html + sitemap.xml only when they changed, then asks Pages to rebuild.
name: Update last night's games

on:
  # Triggered once a day by the Railway worker (hoopshide-backend,
  # src/github_dispatch.py) as soon as last night's NBA games are final, at the
  # latest after the 08:15 Berlin backup: GitHub's own cron starts hours late.
  workflow_dispatch:
  schedule:
    # Backstop for a dead worker only: skips itself if a workflow_dispatch run
    # (worker or manual) already happened today (UTC).
    - cron: '47 9 * * *'

permissions:
  actions: read
  contents: write
  pages: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Backstop - skip if already run today
        id: backstop
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-games.yml/runs?event=workflow_dispatch&created=%3E%3D$today" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))' || echo 0)
          echo "workflow_dispatch runs today: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.backstop.outputs.skip != 'true'
      - name: Rebuild the games section
        if: steps.backstop.outputs.skip != 'true'
        run: python3 scripts/update_games.py
      - name: Commit and publish if changed
        if: steps.backstop.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "Update last night's games"
          git push
          # A push made with the workflow token may not start a Pages build
          # on its own, so request one.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed; the push may still have triggered one."
